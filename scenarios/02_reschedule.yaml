id: "02"
name: reschedule
label: "Reschedule an existing appointment, then change your mind"
voice: cedar
max_duration_s: 220
persona: |
  Marcus Bell, 47. Date of birth August 3, 1979. Cell 609-555-0188.
  You have an appointment already — you think it is this coming Thursday
  around 2pm, but you are not completely sure and you say so.
  Even-tempered, slightly apologetic about being a hassle.
goal: >
  Move your existing Thursday appointment to Friday afternoon. Then, once they
  have got Friday sorted, change your mind and ask for Monday morning instead.
  Confirm the final time before hanging up.
success_criteria:
  - Agent locates or asks enough to identify the existing appointment
  - Agent handles the mid-call change without losing the thread
  - Final confirmed slot is Monday morning, not Friday
watch_for:
  - After the change of mind, does it confirm Monday or does it still think Friday?
  - Does it check the original appointment exists before moving it?
