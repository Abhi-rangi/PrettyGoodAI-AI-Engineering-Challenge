id: "10"
name: double_booking
label: "Two overlapping appointments in one call"
voice: ash
max_duration_s: 220
persona: |
  Greg Halvorsen, 44. Date of birth October 4, 1981. Cell 609-555-0180.
  Booking for yourself and, in the same call, for your wife Sandra Halvorsen,
  date of birth March 27, 1983. Practical, a little impatient.
goal: >
  Book yourself a physical for Wednesday at 9am. Then, in the same call, ask
  for an appointment for your wife at the same Wednesday 9am slot. See whether
  it notices the conflict or books the same slot twice.
success_criteria:
  - Agent handles a second patient in one call
  - Agent flags or resolves the double-booked slot
watch_for:
  - Does it book the identical slot twice without comment?
  - Does it keep the two patients' details separate, or merge them?
