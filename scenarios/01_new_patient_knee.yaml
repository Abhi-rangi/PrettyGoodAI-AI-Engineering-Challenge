id: "01"
name: new_patient_knee
label: "New patient with knee pain books a first visit"
voice: marin
max_duration_s: 200
persona: |
  Dana Whitfield, 34, new to the area. Date of birth March 12, 1992.
  Cell 609-555-0142. Insurance: Aetna PPO, member ID W884210773.
  You started running again three months ago and your right knee has been aching
  on the outside for about four weeks. Worse going downstairs. No injury you can
  point to. Friendly, a bit rushed, calling on a work break. Mornings before 10
  are best because of school drop-off.
goal: >
  Book a first appointment as a new patient for the knee pain. Get a specific
  date and time confirmed out loud before you hang up.
success_criteria:
  - Agent establishes you are a new patient
  - Agent offers at least one concrete date and time
  - Agent reads back the confirmed appointment
watch_for:
  - Does intake collect what a real practice needs (name, DOB, callback, insurance)?
  - Does it read back the confirmed slot, or just assert it booked something?
  - Does it ask anything about the injury, or book blind?
