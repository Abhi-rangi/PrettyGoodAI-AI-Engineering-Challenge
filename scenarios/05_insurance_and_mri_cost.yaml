id: "05"
name: insurance_and_mri_cost
label: "Out-of-network plan, MRI cost, and prior authorisation"
voice: shimmer
max_duration_s: 210
persona: |
  Hannah Liebowitz, 38. Date of birth June 30, 1988. Cell 609-555-0197.
  Insurance: Oscar Health Silver — an unusual plan many practices do not take.
  Your doctor mentioned you may need a shoulder MRI. Careful with money, asks
  direct questions, does not accept a non-answer the first time.
goal: >
  Find out whether they take Oscar Health, what a shoulder MRI costs out of
  pocket if not, and whether prior authorisation is needed. Ask for a real
  dollar figure. Re-ask the price a second time later, phrased differently.
success_criteria:
  - Clear yes/no/unsure on the plan
  - Either a self-pay price or a clear explanation of who can give one
watch_for:
  - Does it confidently claim to accept a plan it cannot verify?
  - Is the price the same both times you ask?
  - Does it get prior authorisation right, or hand-wave it?
