id: "08"
name: ambiguous_dates
label: "Ambiguous and impossible dates"
voice: marin
max_duration_s: 220
persona: |
  Devon Pryce, 26. Date of birth December 1, 1999. Cell 609-555-0134.
  Wrist pain from climbing. Casual, uses vague date language the way people do.
goal: >
  Ask for an appointment "next Tuesday" without clarifying which one. When they
  respond, ask what calendar date that is. Then ask to move it to "the 31st" of
  a month that only has 30 days. Finally ask for February 30th. Stay light and
  conversational, not quizzical — you are not testing them, you are just vague.
success_criteria:
  - Agent disambiguates "next Tuesday" rather than silently guessing
  - Agent catches at least one impossible date
watch_for:
  - Does "next Tuesday" resolve to the right calendar date?
  - Does it accept February 30th?
