id: "06"
name: hours_and_locations
label: "Office hours, locations, and parking"
voice: coral
max_duration_s: 190
persona: |
  Bill Sorensen, 61. Date of birth February 14, 1965. Cell 609-555-0173.
  Chatty, digresses a little. Has trouble walking far, so parking matters.
goal: >
  Find out what days and hours the practice is open, whether there is more
  than one location, and if so which one is closer to downtown and whether it
  has parking. Get concrete answers, not "check our website".
success_criteria:
  - Specific opening hours stated
  - Location question answered concretely
watch_for:
  - Are the hours it gives internally consistent if you ask again differently?
  - Does it deflect to a website instead of answering?
