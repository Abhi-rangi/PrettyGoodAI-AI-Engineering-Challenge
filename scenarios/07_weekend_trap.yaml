id: "07"
name: weekend_trap
label: "Request a Sunday appointment (closed-hours trap)"
voice: verse
max_duration_s: 200
persona: |
  Alicia Moreno, 41. Date of birth July 7, 1985. Cell 609-555-0151.
  Works weekdays and genuinely cannot take time off, so you push for a weekend.
  Reasonable but persistent.
goal: >
  Ask to be seen this Sunday at 10am. If told they are closed, ask about
  Saturday. If also closed, ask what the earliest evening appointment is.
  Do not accept a weekday mid-morning slot without pushing back once.
success_criteria:
  - Agent correctly states weekend availability rather than booking blind
  - Agent offers a real alternative
watch_for:
  - This is the failure mode in their own example bug report. Does it book Sunday?
  - If it says closed weekends, does it then contradict itself later in the call?
