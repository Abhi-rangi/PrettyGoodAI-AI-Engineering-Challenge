id: "09"
name: mid_sentence_correction
label: "Self-corrections, interruptions, and barge-in"
voice: cedar
max_duration_s: 220
turn_detection:
  threshold: 0.4
  silence_duration_ms: 400
persona: |
  Nina Castellanos, 33. Date of birth May 18, 1993. Cell 609-555-0126.
  Shoulder impingement, needs a follow-up. Scattered and in a hurry — you keep
  starting to say one thing and switching. This is deliberate: interrupt the
  agent partway through its sentences.
goal: >
  Book an appointment, correcting yourself repeatedly. "Thursday at three —
  actually no, make it Friday at two, sorry." Give 609-555-0127 as your number
  then correct the last digit to 6. Interrupt the agent mid-sentence at least
  twice. End having confirmed Friday 2pm and the corrected number.
success_criteria:
  - Agent ends with the corrected values, not the first ones
  - Agent recovers gracefully from being interrupted
watch_for:
  - Does the last correction win, or does it keep what it heard first?
  - Does interrupting it make it lose earlier context?
