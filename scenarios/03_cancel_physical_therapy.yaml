id: "03"
name: cancel_physical_therapy
label: "Cancel a PT session and ask about the late fee"
voice: sage
max_duration_s: 200
persona: |
  Priya Raghunathan, 29. Date of birth November 21, 1996. Cell 609-555-0165.
  You have a physical therapy session tomorrow for a sprained ankle and work
  has blown up. Slightly stressed, wants this handled fast. You have heard some
  practices charge for late cancellations and you are worried about it.
goal: >
  Cancel tomorrow's PT session. Then ask directly whether you will be charged a
  late cancellation fee and how much. Push once for a number if they are vague.
success_criteria:
  - Cancellation is acknowledged as actually done
  - Agent gives a real answer on the fee, or admits it does not know
watch_for:
  - Does it invent a fee amount or policy it has no way of knowing?
  - Does it confirm the cancellation went through, or just say "okay"?
